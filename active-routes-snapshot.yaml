    description: Get tracked entity information by TEI UID from DHIS2 Test
    from:
      uri: rest
      parameters:
        method: post
        path: /v1/tei-info
      steps:
        - unmarshal:
            json:
              library: Jackson
        - setHeaders:
            id: setHeaders-2114
            headers:
              - constant:
                  expression: GET
                name: CamelHttpMethod
              - constant:
                  expression: Basic *****
                name: Authorization
              - id: ""
                name: tei
                simple:
                  expression: ${body[tei]}
        - toD:
            uri: https://play.im.dhis2.org/dev-2-42/api/tracker/trackedEntities/${header.tei}?fields=*&bridgeEndpoint=true&throwExceptionOnFailure=false
        - convertBodyTo:
            type: java.lang.String

