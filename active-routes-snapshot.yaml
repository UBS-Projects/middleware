# route_id    : hello-name-route
# path        : /v1/hello
# method      : POST
# version     : 1 (default=true, active=true)
# description : Return hello message using name from request body
# created_by  : admin@mail.com
# ----------------------------------------------------------------
- route:
    id: hello-name-route
    description: Return hello message using name from request body
    from:
      uri: rest
      parameters:
        method: post
        path: /v1/hello
      steps:
        - unmarshal:
            json:
              library: Jackson
        - setBody:
            simple:
              expression: Hello ${body[name]}
        - setHeader:
            constant: text/plain
            name: Content-Type

