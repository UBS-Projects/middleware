server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/middleware_db
    username: sso
    password: sso@admin1
    driver-class-name: org.postgresql.Driver


  sql:
    init:
      mode: always
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    open-in-view: false
    properties:
      hibernate:
        show_sql: true
        format_sql: true
        use_sql_comments: true
      quartz:
        properties:
          spring.quartz.job-store-type: jdbc
          spring.quartz.jdbc.initialize-schema: always
