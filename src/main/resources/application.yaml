springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tryItOutEnabled: true
    operationsSorter: alpha
    tagsSorter: alpha

cache:
  type: simple
  cache-names:
    - dhis2-responses
    - metadata-cache
    - api-definitions



