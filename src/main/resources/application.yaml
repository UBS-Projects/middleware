server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/middleware
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    

  jpa:
    hibernate:
     ddl-auto: update
     database-platform: org.hibernate.dialect.PostgreSQLDialect
     #spring.jpa.database-platform: org.hibernate.dialect.Oracle12cDialect

     show-sql: true

logging:
  level:
    org.springframework.web: DEBUG
    com.middleware.backend: DEBUG

external-api:
  url: https://reqbin.com/echo/post/json
  transformation:
    Id: "#root.productId"
    Customer: "#root.customerName"
    Quantity: "#root.qty"
    Price: "#root.unitPrice * 1.05"





