server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/postgres
    username: postgres
    password: 123
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    open-in-view: false
    properties:
      hibernate:
        show_sql: true
        format_sql: true
        use_sql_comments: true
        # Quartz properties
      quartz:
        properties:
          spring.quartz.job-store-type: jdbc
          spring.quartz.jdbc.initialize-schema: always
#          spring.quartz.properties.org.quartz.jobStore.isClustered: false
#          spring.quartz.properties.org.quartz.scheduler.instanceId: AUTO

management:
  health:
    rabbit:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    org.springframework.web: DEBUG
    com.middleware.backend: DEBUG

camel:
  rest:
    component: servlet     # or netty-http, undertow, http, etc. depending on your setup
    host: localhost
    port: 8081
    context-path: /camel    # optional, base context path for your REST endpoints
  servlet:
    mapping:
      context-path: /camel/*


