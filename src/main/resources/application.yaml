server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/middleware
    username: postgres
    password: root

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    open-in-view: false
    properties:
      hibernate:
        show_sql: true
        format_sql: true
        use_sql_comments: true

management:
  health:
    rabbit:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    org.springframework.web: DEBUG
    com.middleware.backend: DEBUG

camel:
  rest:
    component: servlet     # or netty-http, undertow, http, etc. depending on your setup
    host: localhost
    port: 8081
    context-path: /camel    # optional, base context path for your REST endpoints
  servlet:
    mapping:
      context-path: /camel/*

      